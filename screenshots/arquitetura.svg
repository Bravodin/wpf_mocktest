<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="960" viewBox="0 0 1700 960" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1700" height="960" fill="#f8fafc"/>

  <!-- Título -->
  <text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">ERP Mock — arquitetura com Docker</text>
  <text x="40" y="90" font-size="16" fill="#64748b">O WPF é só a interface; as regras de negócio rodam na API, num container Linux, com PostgreSQL ao lado.</text>

  <!-- ================= Máquina do usuário (Windows) ================= -->
  <rect x="40" y="125" width="440" height="575" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="64" y="160" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">MÁQUINA DO USUÁRIO · WINDOWS</text>

  <g filter="url(#shadow)">
    <rect x="64" y="180" width="392" height="440" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  </g>
  <rect x="64" y="180" width="392" height="58" rx="12" fill="#0f172a"/>
  <rect x="64" y="220" width="392" height="18" fill="#0f172a"/>
  <rect x="82" y="194" width="30" height="30" rx="7" fill="#2563eb"/>
  <text x="97" y="215" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">E</text>
  <text x="124" y="207" font-size="17" font-weight="700" fill="#ffffff">ErpMock.App</text>
  <text x="124" y="226" font-size="12.5" fill="#94a3b8">WPF · .NET 10 · MVVM</text>

  <!-- camadas do app -->
  <rect x="86" y="258" width="348" height="78" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="104" y="286" font-size="15" font-weight="600" fill="#0f172a">Views + ViewModels</text>
  <text x="104" y="308" font-size="13" fill="#475569">Dashboard, Clientes, Produtos,</text>
  <text x="104" y="325" font-size="13" fill="#475569">Vendas, Relatórios</text>

  <line x1="260" y1="338" x2="260" y2="362" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <text x="270" y="355" font-size="11.5" fill="#64748b">ICustomerService, ISaleService…</text>

  <rect x="86" y="366" width="348" height="78" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="104" y="394" font-size="15" font-weight="600" fill="#0f172a">ErpMock.Client</text>
  <text x="104" y="416" font-size="13" fill="#475569">Implementa as interfaces via HttpClient</text>
  <text x="104" y="433" font-size="13" fill="#475569">422 → BusinessException (mesma mensagem)</text>

  <rect x="86" y="462" width="348" height="78" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="104" y="490" font-size="15" font-weight="600" fill="#0f172a">ErpMock.Contracts</text>
  <text x="104" y="512" font-size="13" fill="#475569">Modelos, interfaces e DTOs</text>
  <text x="104" y="529" font-size="13" fill="#475569">compartilhados com a API</text>

  <text x="86" y="572" font-size="12.5" fill="#64748b">appsettings.json</text>
  <text x="86" y="592" font-size="12.5" font-family="Cascadia Mono, Consolas, monospace" fill="#0f172a">ErpApi:BaseUrl = http://localhost:8080/</text>

  <text x="64" y="655" font-size="12.5" fill="#64748b">Não conhece banco nem EF Core.</text>
  <text x="64" y="675" font-size="12.5" fill="#64748b">Só esta parte depende do Windows.</text>

  <!-- ================= Docker ================= -->
  <g transform="translate(100,0)">
  <rect x="520" y="125" width="1040" height="575" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="550" y="160" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="1.5">DOCKER · docker compose up -d --build</text>
  <text x="1530" y="160" font-size="12.5" fill="#475569" text-anchor="end">Linux · rede interna do compose</text>

  <!-- container api -->
  <g filter="url(#shadow)">
    <rect x="604" y="180" width="440" height="440" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  </g>
  <text x="626" y="210" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.2">CONTAINER</text>
  <text x="626" y="236" font-size="22" font-weight="700" fill="#0f172a">api</text>
  <text x="668" y="236" font-size="13" fill="#64748b">dotnet/aspnet:10.0 · multi-stage build</text>

  <rect x="626" y="256" width="396" height="78" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="644" y="284" font-size="15" font-weight="600" fill="#0f172a">ErpMock.Api · ASP.NET Core Minimal API</text>
  <text x="644" y="306" font-size="13" fill="#475569">/api/customers, /products, /sales, /reports…</text>
  <text x="644" y="323" font-size="13" fill="#475569">ProblemDetails (422) · /openapi/v1.json · /health</text>

  <line x1="824" y1="336" x2="824" y2="356" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-dark)"/>

  <rect x="626" y="360" width="396" height="78" rx="9" fill="#ecfdf5" stroke="#86efac"/>
  <text x="644" y="388" font-size="15" font-weight="600" fill="#0f172a">ErpMock.Core · regras de negócio</text>
  <text x="644" y="410" font-size="13" fill="#475569">Venda com baixa de estoque em transação,</text>
  <text x="644" y="427" font-size="13" fill="#475569">cancelamento, CPF/CNPJ, dashboard, relatórios</text>

  <line x1="824" y1="440" x2="824" y2="460" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-dark)"/>

  <rect x="626" y="464" width="396" height="56" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="644" y="490" font-size="15" font-weight="600" fill="#0f172a">EF Core 10 + Npgsql</text>
  <text x="644" y="509" font-size="13" fill="#475569">EnsureCreated + seed na 1ª subida (com retry)</text>

  <rect x="626" y="536" width="396" height="66" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="644" y="558" font-size="12" font-weight="700" fill="#92400e" letter-spacing="1">VARIÁVEIS DE AMBIENTE</text>
  <text x="644" y="578" font-size="12.5" font-family="Cascadia Mono, Consolas, monospace" fill="#0f172a">Database__Provider=Postgres</text>
  <text x="644" y="595" font-size="12.5" font-family="Cascadia Mono, Consolas, monospace" fill="#0f172a">TZ=America/Sao_Paulo</text>

  <!-- api → db -->
  <line x1="1044" y1="300" x2="1196" y2="300" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1120" y="282" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">TCP 5432</text>
  <text x="1120" y="324" font-size="11.5" fill="#475569" text-anchor="middle">Host=db</text>

  <line x1="1044" y1="370" x2="1196" y2="370" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dark)"/>
  <text x="1120" y="392" font-size="11.5" fill="#475569" text-anchor="middle">depends_on:</text>
  <text x="1120" y="408" font-size="11.5" fill="#475569" text-anchor="middle">service_healthy</text>

  <!-- container db -->
  <g filter="url(#shadow)">
    <rect x="1196" y="180" width="340" height="250" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  </g>
  <text x="1218" y="210" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.2">CONTAINER</text>
  <text x="1218" y="236" font-size="22" font-weight="700" fill="#0f172a">db</text>
  <text x="1254" y="236" font-size="13" fill="#64748b">postgres:17</text>

  <!-- elefante estilizado como cilindro de banco -->
  <g transform="translate(1218,256)">
    <ellipse cx="34" cy="10" rx="34" ry="10" fill="#336791"/>
    <rect x="0" y="10" width="68" height="44" fill="#336791"/>
    <ellipse cx="34" cy="54" rx="34" ry="10" fill="#2a5578"/>
    <ellipse cx="34" cy="10" rx="34" ry="10" fill="#4a7fae"/>
    <path d="M0,32 a34,10 0 0,0 68,0" fill="none" stroke="#9cc0e0" stroke-width="1.2"/>
  </g>
  <text x="1304" y="276" font-size="15" font-weight="600" fill="#0f172a">PostgreSQL 17</text>
  <text x="1304" y="296" font-size="13" fill="#475569">banco "erp"</text>
  <text x="1304" y="314" font-size="13" fill="#475569">datas: timestamp</text>
  <text x="1304" y="331" font-size="13" fill="#475569">without time zone</text>

  <text x="1218" y="372" font-size="13" fill="#475569">healthcheck: pg_isready</text>
  <text x="1218" y="392" font-size="13" fill="#475569">5432 não é publicada no host:</text>
  <text x="1218" y="410" font-size="13" fill="#475569">só a API alcança o banco</text>

  <!-- volume -->
  <line x1="1366" y1="432" x2="1366" y2="482" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <text x="1378" y="462" font-size="11.5" fill="#64748b">/var/lib/postgresql/data</text>

  <g transform="translate(1236,486)">
    <ellipse cx="130" cy="14" rx="130" ry="14" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <path d="M0,14 v80 a130,14 0 0,0 260,0 v-80" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <ellipse cx="130" cy="14" rx="130" ry="14" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text x="130" y="52" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">volume pgdata</text>
    <text x="130" y="72" font-size="12.5" fill="#475569" text-anchor="middle">os dados sobrevivem ao down/up</text>
    <text x="130" y="89" font-size="12.5" fill="#475569" text-anchor="middle">docker compose down -v apaga</text>
  </g>

  </g>

  <!-- ================= HTTP: app → porta publicada → container api (por cima das caixas) ================= -->
  <line x1="434" y1="405" x2="604" y2="405" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="545" y="374" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">HTTP / JSON</text>
  <text x="545" y="392" font-size="12" fill="#475569" text-anchor="middle">localhost:8080</text>
  <rect x="606" y="383" width="98" height="44" rx="8" fill="#2563eb"/>
  <text x="655" y="401" font-size="11.5" fill="#dbeafe" text-anchor="middle">porta</text>
  <text x="655" y="418" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">8080:8080</text>

  <!-- ================= Rodapé: sem Docker e testes ================= -->
  <text x="40" y="748" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">TAMBÉM DÁ PARA RODAR</text>

  <rect x="40" y="766" width="790" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="64" y="800" font-size="17" font-weight="700" fill="#0f172a">Sem Docker (desenvolvimento)</text>
  <text x="64" y="830" font-size="13" font-family="Cascadia Mono, Consolas, monospace" fill="#0f172a">dotnet run --project src/ErpMock.Api</text>
  <text x="64" y="858" font-size="14" fill="#475569">A mesma API em localhost:8080, com SQLite num arquivo local</text>
  <text x="64" y="880" font-size="14" fill="#475569">(src/ErpMock.Api/erp.db). Nada para instalar além do .NET 10.</text>
  <text x="64" y="902" font-size="13" fill="#64748b">Troca de banco por configuração: Database:Provider = Sqlite | Postgres</text>

  <rect x="870" y="766" width="790" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="894" y="800" font-size="17" font-weight="700" fill="#0f172a">Testes (Windows e Linux)</text>
  <text x="894" y="830" font-size="14" fill="#475569">Regras de negócio contra SQLite em memória.</text>
  <text x="894" y="852" font-size="14" fill="#475569">A API real em memória (WebApplicationFactory), chamada pelo</text>
  <text x="894" y="874" font-size="14" fill="#475569">mesmo ErpMock.Client do WPF: contrato verificado de ponta a ponta.</text>
  <text x="894" y="902" font-size="13" fill="#64748b">SQL do PostgreSQL verificado offline (PostgresModelTests).</text>
</svg>
